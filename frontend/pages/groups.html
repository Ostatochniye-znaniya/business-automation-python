<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Списки групп — Остаточные знания</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/groups.css">
  </head>
  <body class="groups-page">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <header class="workspace__header"><h1>Формирование списка рекомендуемых групп</h1></header>
      <section class="workspace__content">
        <form id="group-filters" class="group-filters" aria-label="Фильтры групп">
          <label class="field" for="faculty"><span class="field__label">Факультет / институт</span>
            <select id="faculty" class="field__input" disabled><option value="">Все факультеты</option></select>
          </label>
          <label class="field" for="program"><span class="field__label">Направление подготовки</span>
            <select id="program" class="field__input" disabled><option value="">Все направления</option></select>
          </label>
          <label class="field" for="academic-year"><span class="field__label">Учебный год</span>
            <select id="academic-year" class="field__input" disabled><option value="">Все годы</option></select>
          </label>
          <label class="field" for="semester"><span class="field__label">Семестр</span>
            <select id="semester" class="field__input" disabled><option value="">Все семестры</option></select>
          </label>
        </form>
        <p id="recommendation-access" class="section-intro"></p>
        <div class="recommendation-toolbar">
          <label class="field" for="list-period"><span class="field__label">Период для формирования списка</span>
            <select id="list-period" class="field__input" disabled><option value="">Выберите период</option></select>
          </label>
          <label class="field discipline-picker" for="selected-disciplines"><span class="field__label">Дисциплины для рекомендованных групп</span>
            <select id="selected-disciplines" class="field__input" multiple size="4" disabled aria-describedby="discipline-help"></select>
            <span id="discipline-help" class="discipline-picker__help">Выберите одну или несколько дисциплин.</span>
          </label>
          <div class="recommendation-actions">
            <button id="select-visible" class="button" type="button" disabled>Рекомендовать видимые группы</button>
            <button id="clear-visible" class="button" type="button" disabled>Снять выбор видимых групп</button>
          </div>
        </div>
        <p id="groups-status" role="status" aria-live="polite">Загрузка справочников…</p>
        <button id="retry" class="button" type="button" hidden>Повторить загрузку</button>
        <div class="table-scroll">
          <table class="table" aria-label="Учебные группы">
            <thead id="groups-head"><tr><th>Группа</th><th>Курс</th><th>Предыдущие тестирования</th><th>Текущие тестирования</th><th>Планируемые тестирования</th></tr></thead>
            <tbody id="groups-body"></tbody>
          </table>
        </div>
        <div class="recommendation-actions recommendation-actions--footer">
          <button id="save-recommendations" class="button button--primary" type="button" disabled>Сохранить изменения</button>
          <button id="save-disciplines" class="button button--primary" type="button" disabled>Закрепить дисциплины</button>
          <button id="discard-recommendations" class="button" type="button" disabled>Отменить изменения</button>
          <button id="export-recommendations" class="button" type="button" disabled>Сформировать список (CSV)</button>
          <span id="recommendation-changes" role="status" aria-live="polite">Нет несохранённых изменений</span>
        </div>
        <p id="recommendation-status" class="section-status" role="status" aria-live="polite"></p>
        <p id="period-context" class="period-context"></p>
        <p class="testing-legend"><span><i class="testing-mark testing-mark--completed" aria-hidden="true">✓</i> Проведено</span><span><i class="testing-mark testing-mark--planned" aria-hidden="true">✓</i> Запланировано</span><span><i class="testing-mark testing-mark--active" aria-hidden="true">◐</i> Проводится</span><span><i class="testing-mark testing-mark--missing" aria-hidden="true">×</i> Нет назначения / отменено</span></p>
      </section>
    </main>
    <dialog id="recommendation-history" class="recommendation-dialog" aria-labelledby="history-title">
      <div class="recommendation-history-header"><h2 id="history-title">История рекомендаций</h2><button id="close-history" class="button" type="button" aria-label="Закрыть историю">Закрыть</button></div>
      <p id="history-status" class="section-status" role="status"></p>
      <button id="retry-history" class="button" type="button" hidden>Повторить загрузку истории</button>
      <div class="table-scroll"><table class="table"><thead><tr><th>Период</th><th>Изменение</th><th>Автор</th><th>Дата</th></tr></thead><tbody id="history-body"></tbody></table></div>
    </dialog>
    <script src="../js/layout.js"></script>
    <script src="/app-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/groups.js"></script>
  </body>
</html>
