<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки доступа — даты</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/periods.css">
  </head>
  <body class="periods-page" data-page="periods">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <section class="access-settings-card" aria-labelledby="access-settings-title">
        <header class="access-settings-header">
          <h1 id="access-settings-title">Настройки доступа</h1>
          <nav class="access-settings-tabs" aria-label="Настройки доступа">
            <a class="button" href="/pages/access.html">Настройка ролей</a>
            <a class="button button--active" href="/pages/optionsDate.html" aria-current="page">Настройка дат</a>
          </nav>
        </header>
        <label class="semester-field" for="semester-filter">
          <span class="field__label">Семестр</span>
          <select id="semester-filter" class="field__input" disabled>
            <option value="">Выберите семестр</option>
          </select>
        </label>
        <p id="section-status" class="section-status" role="status" aria-live="polite">Загрузка…</p>
        <button id="section-retry" class="button" type="button" hidden>Повторить загрузку</button>
        <div class="deadlines-layout">
          <section class="deadlines-section" aria-labelledby="deadlines-schedule-title">
            <h2 id="deadlines-schedule-title">Списки, графики и анкетирование</h2>
            <div id="schedule-deadlines" class="deadlines-list"></div>
          </section>
          <section class="deadlines-section" aria-labelledby="deadlines-reports-title">
            <h2 id="deadlines-reports-title">Отчёты</h2>
            <div id="report-deadlines" class="deadlines-list"></div>
          </section>
        </div>
      </section>
    </main>
    <script src="/js/layout.js"></script>
    <script src="/app-config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/sections.js"></script>
  </body>
</html>
