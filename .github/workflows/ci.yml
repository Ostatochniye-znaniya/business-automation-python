name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, project-completion]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Run pytest
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend tests
        run: node --test tests/frontend/*.test.cjs

  mysql:
    name: MySQL migrations and workflow
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: verification_root_only
          MYSQL_DATABASE: knowledge_verification
          MYSQL_USER: verification
          MYSQL_PASSWORD: verification_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DATABASE_URL: mysql+asyncmy://verification:verification_only@127.0.0.1:3306/knowledge_verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest tests/test_workflow.py -v
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  browser:
    name: Browser workflow
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,browser]'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/check_workflow.py --output .qa/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workflow
          path: .qa/browser

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, mysql, browser]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ba-preview-check .
