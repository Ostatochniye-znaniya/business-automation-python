<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Остаточные знания</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <header class="workspace__header"><h1>Вход в систему</h1></header>
      <section class="workspace__content">
        <p id="login-status" role="status">Загрузка…</p>
        <form id="login-form" hidden>
          <label class="field"
            >Пользователь локального стенда<select
              id="login-user"
              class="field__input"
              required
            ></select
          ></label>
          <button class="button">Войти</button>
        </form>
        <button id="logout" class="button">Выйти</button>
      </section>
    </main>
    <script src="/js/layout.js"></script>
    <script src="/app-config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/login.js"></script>
  </body>
</html>
